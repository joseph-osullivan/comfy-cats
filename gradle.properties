# Increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
# Loom is not yet compatible with the configuration cache.
org.gradle.configuration-cache=false

# Fabric Properties
# Verify current values at https://fabricmc.net/develop
# 26.1+ Minecraft ships unobfuscated, so there are no yarn mappings to declare.
minecraft_version=26.3-snapshot-3
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.comfycats
archives_base_name=comfy-cats
