plugins {
	// The new non-remapping Loom plugin used from Minecraft 26.1 onwards
	// (the game is now unobfuscated, so nothing needs remapping).
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Loom automatically adds the Minecraft and Fabric maven repositories.
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings dependency: 26.1+ ships with official Mojang names baked in.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// This mod only touches vanilla classes via a mixin, so it does not need Fabric API.
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
